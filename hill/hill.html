<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Cipher Encryptor</title>
    <link rel="stylesheet" href="hill.css">
</head>
<body>
    <div class="container">
        <h1>Hill Cipher</h1>
        <input type="text" id="text-input" placeholder="Enter text (even-length, A-Z)..." />
        <input type="text" id="key-input" placeholder="Enter key matrix (e.g. 3 3 2 5)" />

        <button onclick="encryptText()">Encrypt</button>
        <button onclick="decryptText()">Decrypt</button>

        <h2>Result:</h2>
        <pre id="output"></pre>
    </div>

    <button class="hint-button" onclick="showHint()">Hint</button>
    <script src="hill.js"></script>
</body>
</html>
