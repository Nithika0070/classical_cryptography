<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autokey Cipher Encryptor</title>
    <link rel="stylesheet" href="autoclave.css">
</head>
<body>
    <div class="container">
        <h1>Autokey Cipher</h1>
        <input type="text" id="text-input" placeholder="Enter text..." />
        <input type="text" id="key-input" placeholder="Enter keyword..." />

        <button onclick="encryptText()">Encrypt</button>
        <button onclick="decryptText()">Decrypt</button>

        <h2>Result:</h2>
        <pre id="output"></pre>
    </div>

    <button class="hint-button" onclick="showHint()">Hint</button>
    <script src="autoclave.js"></script>
</body>
</html>
