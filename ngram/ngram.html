<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Gram Analyzer</title>
    <link rel="stylesheet" href="ngram.css">
</head>
<body>
    <div class="container">
        <h1>N-Gram Analyzer</h1>
        <input type="text" id="text-input" placeholder="Enter text..." />
        <input type="number" id="n-input" placeholder="Enter n (e.g. 2 for bigram)" min="1" />

        <button onclick="analyzeText()">Analyze</button>

        <h2>Result:</h2>
        <pre id="output"></pre>
    </div>

    <button class="hint-button" onclick="showHint()">Hint</button>
    <script src="ngram.js"></script>
</body>
</html>
